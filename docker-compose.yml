# Pin the project name. Without this Docker names the project after the folder, so renaming the
# folder would create a new network and volume and clash with the running containers.
name: jester_fraudpipeline

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      - "127.0.0.1:9092:9092"  # this machine only; Kafka here has no login
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    environment:
      # Set in .env (copy .env.example). Compose refuses to start Redis without it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (copy .env.example to .env)}
    # The password goes into a config file, not onto the command line, so it never shows up in a
    # process list. --appendonly keeps state across Redis restarts too.
    command:
      - sh
      - -c
      - |
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"  # this machine only
    volumes:
      - redisdata:/data

volumes:
  redisdata:
