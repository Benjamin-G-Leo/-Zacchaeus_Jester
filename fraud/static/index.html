<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud Alerts</title>
<style>
  :root {
    --bg: #0f1216; --panel: #181d24; --line: #262d37; --text: #e6e9ee; --muted: #8b95a3;
    --travel: #ff6b6b; --velocity: #f5b942; --amount: #5ab0ff; --ok: #4cd08a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6f8; --panel: #fff; --line: #dfe4ea; --text: #1b2330; --muted: #637083; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .live { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--travel); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 28px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 14px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .tag.impossible_travel { background: color-mix(in srgb, var(--travel) 20%, transparent); color: var(--travel); }
  .tag.velocity { background: color-mix(in srgb, var(--velocity) 20%, transparent); color: var(--velocity); }
  .tag.amount_spike { background: color-mix(in srgb, var(--amount) 20%, transparent); color: var(--amount); }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { th:nth-child(5), td:nth-child(5) { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fraud Alerts</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Transactions</div><div class="value" id="tx">0</div></div>
    <div class="card"><div class="label">Tx / sec</div><div class="value" id="rate">0</div></div>
    <div class="card"><div class="label">Alerts</div><div class="value" id="alerts">0</div></div>
    <div class="card"><div class="label">Impossible travel</div><div class="value" id="r-travel">0</div></div>
    <div class="card"><div class="label">Velocity</div><div class="value" id="r-velocity">0</div></div>
    <div class="card"><div class="label">Amount spike</div><div class="value" id="r-amount">0</div></div>
  </section>

  <section class="panel">
    <h2>Latest alerts</h2>
    <table>
      <thead><tr><th>Time</th><th>Rule</th><th>User</th><th>Amount</th><th>Detail</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No alerts yet. Start the producer and detector.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const label = { impossible_travel: "Impossible travel", velocity: "Velocity", amount_spike: "Amount spike" };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = x => (x || 0).toLocaleString();

async function tick() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const s = await r.json();
    $("tx").textContent = n(s.tx_total);
    $("rate").textContent = s.tx_per_sec;
    $("alerts").textContent = n(s.alert_total);
    $("r-travel").textContent = n(s.by_rule.impossible_travel);
    $("r-velocity").textContent = n(s.by_rule.velocity);
    $("r-amount").textContent = n(s.by_rule.amount_spike);
    $("empty").style.display = s.alerts.length ? "none" : "block";
    $("rows").innerHTML = s.alerts.map(a => `
      <tr>
        <td class="num">${new Date(a.ts * 1000).toLocaleTimeString()}</td>
        <td><span class="tag ${esc(a.rule)}">${esc(label[a.rule] || a.rule)}</span></td>
        <td>${esc(a.user_id)}</td>
        <td class="num">$${Number(a.amount).toFixed(2)}</td>
        <td>${esc(a.detail)}</td>
      </tr>`).join("");
    $("dot").classList.remove("off");
    $("status").textContent = "live";
  } catch (e) {
    $("dot").classList.add("off");
    $("status").textContent = "disconnected";
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
